schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = [
  { source = "/app/ledger", exclude = [".auto-bean/runtime", ".auto-bean/tmp"] },
  "/logs/agent",
  "/opt/eval-evidence",
]

[task]
name = "auto-bean/stale-review"
version = "3.1.0"

[metadata]
category = "financial-workflow"
description = "Refuse a stale approval after a harness edit to a reviewed decision and present renewed review without writes."

[agent]
timeout_sec = 1200

[verifier]
timeout_sec = 120
environment_mode = "separate"

[environment]
cpus = 2
memory_mb = 8192
storage_mb = 20480
build_timeout_sec = 1800
workdir = "/app/ledger"


[[steps]]
name = "review"
min_reward = 1.0

[[steps]]
name = "stale"
