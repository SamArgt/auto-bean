[project]
name = "auto-bean-dev"
version = "0.2.49"
description = "Development tooling for the auto-bean Codex plugin."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "beancount>=3.2.3",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.6,<0.18",
    "pyyaml>=6.0.4,<7",
    "types-pyyaml>=6.0.12.20261122,<7",
    "jsonschema>=4.26.0,<5",
    "types-jsonschema>=4.26.0.20261006,<5",
    "mcp>=2.3.0,<3",
]
eval = [
    "beancount>=3.2.3",
    "harbor==0.27.0",
    "reportlab>=5.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["plugins/auto-bean/runtime"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["plugins/auto-bean/runtime", "tests", "scripts", "evals"]
mypy_path = ["plugins/auto-bean/runtime", "scripts"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["harbor.*", "reportlab.*", "beancount.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
