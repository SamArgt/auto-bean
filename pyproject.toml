[project]
name = "auto-bean-dev"
version = "0.2.0"
description = "Development tooling for the auto-bean Codex plugin."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pytest>=7.4,<9",
    "ruff>=0.15.2,<0.16",
    "pyyaml>=6,<7",
    "types-pyyaml>=6,<7",
    "jsonschema>=4,<5",
    "types-jsonschema>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["plugins/auto-bean/runtime"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["plugins/auto-bean/runtime", "tests", "scripts"]
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py313"
