name: Renovate

on:
  schedule:
    - cron: "17 7 * * *" # Daily at 07:17 UTC.
  workflow_dispatch:
  issues:
    types: [edited]
  workflow_run:
    workflows: [Repository Baseline]
    types: [completed]
    branches: [main, "renovate/**"]

permissions:
  contents: read

jobs:
  dashboard-request:
    if: >-
      github.event_name == 'issues' && vars.RENOVATE_APP_ID != '' &&
      github.event.issue.user.login == 'auto-bean-renovate[bot]' &&
      github.event.issue.title == 'Dependency Dashboard' &&
      github.event.issue.state == 'open' &&
      github.event.sender.login == github.repository_owner &&
      github.event.changes.body.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requested: ${{ steps.dashboard.outputs.requested }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Detect a newly checked dashboard action
        id: dashboard
        run: uv run --no-project python scripts/renovate.py dashboard-request

  update:
    needs: dashboard-request
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.RENOVATE_APP_ID != '' &&
      (github.event_name != 'issues' || needs.dashboard-request.outputs.requested == 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main') ||
         (vars.RENOVATE_AUTOMERGE == 'true' &&
          github.event.workflow_run.event == 'pull_request' &&
          startsWith(github.event.workflow_run.head_branch, 'renovate/')))))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Filter issue edits before entering the shared queue. Bot updates must not
    # replace a pending refresh. The latest refresh reads all checked requests.
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the trusted merge helper, never code from the triggering PR.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: actions/setup-node@v4
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Fail at token creation if the App installation lacks a permission.
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write
      - name: Identify the App
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
        id: identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          echo "author=${APP_SLUG}[bot] <${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - name: Update dependencies and prepare PRs
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
        env:
          LOG_LEVEL: debug
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_GIT_AUTHOR: ${{ steps.identity.outputs.author }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_BINARY_SOURCE: global
          RENOVATE_ALLOWED_COMMANDS: '["^uv run --no-project python scripts/renovate\\.py prepare --base-ref origin/main$"]'
        run: npx --yes --package renovate@44.238.1 -- renovate "$GITHUB_REPOSITORY"
      - name: Merge eligible PRs
        if: vars.RENOVATE_AUTOMERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: uv run --no-project python scripts/renovate.py merge
