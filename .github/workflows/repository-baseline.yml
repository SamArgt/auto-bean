name: Repository Baseline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-baseline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Check runtime lock
        run: uv lock --project plugins/auto-bean/runtime --check

      - name: Ruff
        run: uv run ruff check

      - name: Formatting
        run: uv run ruff format --check

      - name: Pytest
        run: uv run pytest

      - name: Mypy
        run: uv run mypy

      - name: Check plugin package
        run: uv run python scripts/package_plugin.py --check

      - name: Packaged runtime smoke
        run: uv run python scripts/smoke_plugin.py

