name: Release plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --group eval
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix frontend/import-review ci
      - run: npm --prefix frontend/import-review run build
      - run: npm --prefix frontend/import-review test
      - run: git diff --exit-code -- plugins/auto-bean/ui
      - run: uv lock --project plugins/auto-bean/runtime --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest tests evals/harbor/tests
      - run: uv run python scripts/package_plugin.py --check
      - run: uv run python scripts/smoke_plugin.py

  release:
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/publish-plugin.yml
